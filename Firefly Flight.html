<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Firefly Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#1E2B4A; --sky-bot:#3D5A80; --water:#2B5468; --reed:#4F7F5A; --reed-dark:#355C40;
  --glow:#FFD66B; --lily:#E8A0BF; --ink:#F4F7FB; --ink-soft:#C9D4E5; --panel:rgba(20,30,52,.72);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --sky-top:#9CC9D9; --sky-bot:#F2D7B6; --water:#5F9AA8; --reed:#3E7A4F; --reed-dark:#2C5A39;
    --glow:#F2A900; --lily:#D9668F; --ink:#1D2B3A; --ink-soft:#3E5166; --panel:rgba(255,255,255,.78);
    color-scheme:light;
  }
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--sky-top);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--ink)}
#wrap{position:relative;height:100%;width:100%;max-width:520px;margin:0 auto;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#score{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:clamp(48px,14vw,72px);font-weight:800;letter-spacing:-.02em;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.overlay.hidden{display:none}
h1{font-size:clamp(52px,16vw,84px);line-height:.88;font-weight:800;letter-spacing:-.03em}
h1 span{display:block;color:var(--glow);text-shadow:0 0 28px color-mix(in srgb,var(--glow) 60%,transparent)}
.sub{font-size:18px;color:var(--ink-soft);font-weight:500;max-width:30ch}
.card{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:28px;padding:26px 30px;min-width:240px}
.card h2{font-size:34px;font-weight:800;line-height:1}
.stats{display:flex;justify-content:center;gap:34px;margin:18px 0 6px}
.stats b{display:block;font-size:40px;line-height:1;font-weight:800}
.stats small{font-size:15px;color:var(--ink-soft)}
.newbest{color:var(--glow);font-weight:700;font-size:16px;min-height:20px}
button{font:inherit;font-weight:800;font-size:22px;border:0;border-radius:999px;padding:14px 40px;background:var(--glow);color:#1D2B3A;cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--glow) 55%,#000)}
button:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--glow) 55%,#000)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.hint{font-size:15px;color:var(--ink-soft)}
#mute{position:absolute;top:22px;right:16px;width:46px;height:46px;padding:0;border-radius:50%;font-size:20px;background:var(--panel);color:var(--ink);box-shadow:none;z-index:5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#mute:active{transform:scale(.92);box-shadow:none}
.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink-soft);font-size:18px;padding:10px 28px}
.ghost:active{transform:scale(.97);box-shadow:inset 0 0 0 2px var(--ink-soft)}
.board{list-style:none;text-align:left;margin-top:10px;min-width:230px}
.board li{display:flex;align-items:baseline;gap:10px;padding:5px 2px;font-size:17px;border-top:1px solid color-mix(in srgb,var(--ink-soft) 25%,transparent)}
.board li:first-child{border-top:0}
.board .rank{width:22px;color:var(--ink-soft);font-weight:700}
.board .who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pts{font-weight:800}
.board li.me .who,.board li.me .pts{color:var(--glow)}
.board .empty{color:var(--ink-soft);justify-content:center;border:0}
.btns{display:flex;flex-direction:column;align-items:center;gap:12px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="score" aria-live="polite">0</div>
  <button id="mute" aria-label="Mute sound">🔊</button>

  <div class="overlay" id="start">
    <h1>Firefly<span>Flight</span></h1>
    <p class="sub">Tap to flutter through the reeds. Catch dewdrops for bonus points.</p>
    <div class="btns">
      <button id="playBtn">Play</button>
      <button class="ghost hidden-lb" id="lbBtn" hidden>Leaderboard</button>
    </div>
    <p class="hint" id="bestStart"></p>
  </div>

  <div class="overlay hidden" id="lb">
    <div class="card">
      <h2>Top fireflies</h2>
      <ol class="board" id="boardFull"></ol>
    </div>
    <button class="ghost" id="lbClose">Back</button>
  </div>

  <div class="overlay hidden" id="over">
    <div class="card">
      <h2>Lights out</h2>
      <div class="stats">
        <div><b id="finalScore">0</b><small>Score</small></div>
        <div><b id="finalBest">0</b><small>Best</small></div>
      </div>
      <p class="newbest" id="newBest"></p>
      <ol class="board" id="boardOver" hidden></ol>
    </div>
    <button id="againBtn">Play again</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const wrap = document.getElementById('wrap');
  const scoreEl = document.getElementById('score');
  const startEl = document.getElementById('start'), overEl = document.getElementById('over');
  let W = 0, H = 0, dpr = 1;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let C = {};
  function loadColors(){ C = {top:css('--sky-top'),bot:css('--sky-bot'),water:css('--water'),reed:css('--reed'),reedD:css('--reed-dark'),glow:css('--glow'),lily:css('--lily')}; }
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth; H = wrap.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    loadColors();
  }
  window.addEventListener('resize', resize);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', loadColors);
  resize();

  // ---------- sound (synthesized, no files) ----------
  let actx = null, muted = false;
  try { muted = localStorage.getItem('ff-muted') === '1'; } catch(e) {}
  const muteBtn = document.getElementById('mute');
  const paintMute = () => { muteBtn.textContent = muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Mute sound'); };
  paintMute();
  muteBtn.addEventListener('click', () => { muted = !muted; paintMute(); try { localStorage.setItem('ff-muted', muted ? '1' : '0'); } catch(e) {} if (!muted) { unlock(); sfx.tick(); } });
  function unlock(){
    if (!actx) { const A = window.AudioContext || window.webkitAudioContext; if (A) actx = new A(); }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, dur, {type='sine', vol=0.18, slide=0, delay=0}={}){
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    flap(){ tone(520 + Math.random()*60, 0.09, {type:'triangle', vol:0.08, slide:340}); },
    tick(){ tone(880, 0.07, {vol:0.1}); tone(1320, 0.09, {vol:0.07, delay:0.04}); },
    dew(){ [988, 1319, 1760].forEach((f,i) => tone(f, 0.16, {type:'sine', vol:0.12, delay:i*0.06})); },
    die(){ tone(440, 0.45, {type:'sawtooth', vol:0.09, slide:-330}); tone(220, 0.5, {type:'triangle', vol:0.12, slide:-150, delay:0.05}); },
    best(){ [784, 988, 1175, 1568].forEach((f,i) => tone(f, 0.22, {type:'triangle', vol:0.11, delay:0.5 + i*0.09})); }
  };

  let best = 0;
  try { best = +localStorage.getItem('ff-best') || 0; } catch(e) {}
  const showBest = () => document.getElementById('bestStart').textContent = best ? `Best: ${best}` : '';
  showBest();

  // game state
  let state = 'menu', fly, reeds, drops, sparks, stars, score, speed, spawnT, t = 0, shake = 0;
  stars = Array.from({length:40}, () => ({x:Math.random(), y:Math.random()*0.6, r:Math.random()*1.4+.4, p:Math.random()*6}));

  function reset(){
    fly = {x:W*0.3, y:H*0.42, vy:0, r:11};
    reeds = []; drops = []; sparks = [];
    score = 0; speed = 2.6; spawnT = 0;
    scoreEl.textContent = '0';
  }
  reset();

  const waterY = () => H - 70;
  const gapSize = () => Math.max(150, 210 - score * 2.2);

  function spawn(){
    const gap = gapSize(), margin = 70;
    const top = margin + Math.random() * (waterY() - margin*2 - gap);
    reeds.push({x:W + 40, w:46, top, gap, passed:false, sway:Math.random()*6});
    if (Math.random() < 0.55) drops.push({x:W + 40 + 23 + 130, y: top + gap/2 + (Math.random()-.5)*gap*0.4, got:false, p:0});
  }

  function flap(){
    if (state !== 'play') return;
    fly.vy = -7.2; sfx.flap();
    for (let i=0;i<6;i++) sparks.push({x:fly.x, y:fly.y+6, vx:-Math.random()*2-1, vy:Math.random()*2, life:1});
  }

  function start(){
    unlock();
    reset(); state = 'play';
    startEl.classList.add('hidden'); overEl.classList.add('hidden'); lbEl.classList.add('hidden');
    flap();
  }

  function die(){
    if (state !== 'play') return;
    state = 'dead'; shake = 12; sfx.die();
    if (navigator.vibrate) navigator.vibrate(60);
    const isBest = score > best;
    if (isBest){ best = score; try { localStorage.setItem('ff-best', best); } catch(e) {} }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = best;
    document.getElementById('newBest').textContent = isBest && score > 0 ? 'New best!' : '';
    if (isBest && score > 0) sfx.best();
    submitScore(best);
    renderBoards();
    setTimeout(() => overEl.classList.remove('hidden'), 550);
    showBest();
  }

  // dt = 1.0 at 60fps, 0.5 at 120fps, 0.42 at 144fps -> same speed on every screen
  function update(dt){
    t += dt;
    stars.forEach(s => s.p += 0.03 * dt);
    if (state === 'menu'){ fly.y = H*0.42 + Math.sin(t/22)*14; return; }
    fly.vy += 0.38 * dt; fly.vy = Math.min(fly.vy, 9);
    fly.y += fly.vy * dt;
    if (state === 'dead'){ if (fly.y > waterY()) fly.y = waterY(); return; }

    speed = 2.6 + Math.min(score * 0.05, 2.2);
    spawnT -= speed * dt;
    if (spawnT <= 0){ spawn(); spawnT = 260; }

    reeds.forEach(r => {
      r.x -= speed * dt;
      if (!r.passed && r.x + r.w < fly.x){ r.passed = true; score++; scoreEl.textContent = score; sfx.tick(); }
      const inX = fly.x + fly.r > r.x && fly.x - fly.r < r.x + r.w;
      if (inX && (fly.y - fly.r < r.top || fly.y + fly.r > r.top + r.gap)) die();
    });
    reeds = reeds.filter(r => r.x > -80);

    drops.forEach(d => {
      d.x -= speed * dt; d.p += 0.08 * dt;
      if (!d.got && Math.hypot(d.x - fly.x, d.y - fly.y) < 22){
        d.got = true; score += 3; scoreEl.textContent = score; sfx.dew();
        for (let i=0;i<14;i++){ const a = Math.random()*Math.PI*2; sparks.push({x:d.x,y:d.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,life:1,pink:true}); }
      }
    });
    drops = drops.filter(d => d.x > -30 && !d.got);

    if (fly.y + fly.r > waterY() || fly.y - fly.r < 0) die();

    sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= 0.035 * dt; });
    sparks = sparks.filter(s => s.life > 0);
  }

  function drawReed(r){
    const wy = waterY();
    ctx.fillStyle = C.reed;
    // top reed hangs from sky as a willow branch
    roundRect(r.x, -20, r.w, r.top + 20, 22);
    // bottom reed rises from water
    roundRect(r.x, r.top + r.gap, r.w, wy - (r.top + r.gap) + 20, 22);
    ctx.fillStyle = C.reedD;
    roundRect(r.x + r.w*0.62, -20, r.w*0.2, r.top + 14, 8);
    roundRect(r.x + r.w*0.62, r.top + r.gap + 6, r.w*0.2, wy - (r.top + r.gap), 8);
    // cattail tip
    ctx.fillStyle = C.reedD;
    ctx.beginPath(); ctx.ellipse(r.x + r.w/2, r.top + r.gap + 4, r.w*0.42, 14, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r.x + r.w/2, r.top - 4, r.w*0.42, 14, 0, 0, Math.PI*2); ctx.fill();
  }
  function roundRect(x,y,w,h,rad){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,rad) : ctx.rect(x,y,w,h); ctx.fill(); }

  function draw(dt){
    ctx.save();
    if (shake > 0){ ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= Math.pow(0.85, dt); if (shake < .5) shake = 0; }
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, C.top); g.addColorStop(1, C.bot);
    ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);

    stars.forEach(s => { ctx.globalAlpha = 0.35 + Math.sin(s.p)*0.3; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;

    reeds.forEach(drawReed);

    drops.forEach(d => {
      const y = d.y + Math.sin(d.p)*4;
      ctx.shadowColor = C.lily; ctx.shadowBlur = 16; ctx.fillStyle = C.lily;
      ctx.beginPath(); ctx.moveTo(d.x, y - 11); ctx.quadraticCurveTo(d.x + 9, y + 2, d.x, y + 8); ctx.quadraticCurveTo(d.x - 9, y + 2, d.x, y - 11); ctx.fill();
      ctx.shadowBlur = 0;
    });

    // water
    const wy = waterY();
    ctx.fillStyle = C.water; ctx.fillRect(-20, wy, W+40, H - wy + 20);
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
    for (let i=0;i<3;i++){ ctx.beginPath(); for (let x=0;x<=W;x+=8){ const y = wy + 14 + i*16 + Math.sin(x/28 + t/18 + i)*3; x ? ctx.lineTo(x,y) : ctx.moveTo(x,y);} ctx.stroke(); }

    // sparks
    sparks.forEach(s => { ctx.globalAlpha = s.life; ctx.fillStyle = s.pink ? C.lily : C.glow; ctx.beginPath(); ctx.arc(s.x, s.y, 2.6*s.life+1, 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;

    // firefly
    const tilt = Math.max(-0.5, Math.min(0.9, fly.vy/10));
    ctx.save(); ctx.translate(fly.x, fly.y); ctx.rotate(tilt);
    const halo = ctx.createRadialGradient(0,0,2,0,0,40);
    halo.addColorStop(0, C.glow); halo.addColorStop(1, 'transparent');
    ctx.globalAlpha = 0.55 + Math.sin(t/6)*0.15; ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    const flapA = Math.sin(t/2.2)*0.6;
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.ellipse(-2,-9,9,5,-0.6+flapA,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4,-9,8,4.5,-0.2+flapA,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = C.glow; ctx.beginPath(); ctx.ellipse(-4,2,10,8,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2B2F3A'; ctx.beginPath(); ctx.ellipse(7,-1,7,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(9,-2.5,2.2,0,Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  let last = performance.now();
  function loop(now){
    // cap dt so a tab switch or lag spike can't teleport the firefly into a reed
    const dt = Math.min((now - last) / (1000 / 60), 3);
    last = now;
    update(dt); draw(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(t0 => { last = t0; loop(t0); });

  const press = e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    if (state === 'play') flap();
  };
  wrap.addEventListener('pointerdown', press);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      if (state === 'play') flap(); else if (state === 'menu' || !overEl.classList.contains('hidden')) start();
    }
  });
  // ---------- leaderboard (shared) ----------
  const lbEl = document.getElementById('lb');
  let db = null, user = null, myId = null, top = [], posted = 0;
  async function initBoard(){
    try {
      [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    } catch(e) { return; }
    if (!db) return;
    if (user) { try { myId = await user.id(); } catch(e) {} }
    document.getElementById('lbBtn').hidden = false;
    if (myId) {
      try { const s = await db.doc('scores/' + myId).get(); if (s.exists) posted = +(s.data().score) || 0; } catch(e) {}
      if (best > posted) submitScore(best);
    }
    db.collection('scores').orderBy('score', 'desc').limit(10).onSnapshot(snap => {
      top = snap.docs.map(d => ({id:d.id, score:+(d.data()?.score) || 0}));
      renderBoards();
    }, () => {});
  }
  async function submitScore(s){
    if (!db || !myId || s <= posted) return;
    const prev = posted; posted = s;
    try { await db.doc('scores/' + myId).set({score: s, at: Date.now()}); } catch(e) { posted = prev; }
  }
  async function renderBoards(){
    let names = {};
    if (user && top.length) { try { names = await user.profiles(top.map(t => t.id)); } catch(e) {} }
    for (const id of ['boardFull', 'boardOver']) {
      const ol = document.getElementById(id);
      const rows = id === 'boardOver' ? top.slice(0, 5) : top;
      ol.replaceChildren();
      if (id === 'boardOver') ol.hidden = !db || !rows.length;
      if (!rows.length) {
        const li = document.createElement('li'); li.className = 'empty';
        li.textContent = db ? 'No scores yet. Be the first.' : 'Leaderboard is unavailable here.';
        ol.append(li); continue;
      }
      rows.forEach((r, i) => {
        const li = document.createElement('li'); if (r.id === myId) li.className = 'me';
        const a = document.createElement('span'); a.className = 'rank'; a.textContent = i + 1;
        const b = document.createElement('span'); b.className = 'who';
        b.textContent = r.id === myId ? 'You' : ((names[r.id] && names[r.id].name) || 'A firefly');
        const c = document.createElement('span'); c.className = 'pts'; c.textContent = r.score;
        li.append(a, b, c); ol.append(li);
      });
    }
  }
  document.getElementById('lbBtn').addEventListener('click', () => { unlock(); renderBoards(); startEl.classList.add('hidden'); lbEl.classList.remove('hidden'); });
  document.getElementById('lbClose').addEventListener('click', () => { lbEl.classList.add('hidden'); startEl.classList.remove('hidden'); });
  if (window.claude && claude.use) initBoard();

  document.getElementById('playBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
})();
</script>
</body>
  </html>
