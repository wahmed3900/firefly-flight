<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Firefly Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#1E2B4A; --sky-bot:#3D5A80; --water:#2B5468; --reed:#4F7F5A; --reed-dark:#355C40;
  --glow:#FFD66B; --lily:#E8A0BF; --ink:#F4F7FB; --ink-soft:#C9D4E5; --panel:rgba(20,30,52,.72);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --sky-top:#9CC9D9; --sky-bot:#F2D7B6; --water:#5F9AA8; --reed:#3E7A4F; --reed-dark:#2C5A39;
    --glow:#F2A900; --lily:#D9668F; --ink:#1D2B3A; --ink-soft:#3E5166; --panel:rgba(255,255,255,.78);
    color-scheme:light;
  }
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--sky-top);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--ink)}
#wrap{position:relative;height:100%;width:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#score{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:clamp(40px,11vmin,72px);font-weight:800;letter-spacing:-.02em;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.overlay.hidden{display:none}
h1{font-size:clamp(44px,15vmin,84px);line-height:.88;font-weight:800;letter-spacing:-.03em}
h1 span{display:block;color:var(--glow);text-shadow:0 0 28px color-mix(in srgb,var(--glow) 60%,transparent)}
.sub{font-size:18px;color:var(--ink-soft);font-weight:500;max-width:30ch}
.card{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:28px;padding:26px 30px;min-width:240px}
.card h2{font-size:34px;font-weight:800;line-height:1}
.stats{display:flex;justify-content:center;gap:34px;margin:18px 0 6px}
.stats b{display:block;font-size:40px;line-height:1;font-weight:800}
.stats small{font-size:15px;color:var(--ink-soft)}
#hud{position:absolute;top:calc(28px + clamp(40px,11vmin,72px));left:0;right:0;display:flex;justify-content:center;gap:7px;pointer-events:none}
.pip{width:12px;height:12px;border-radius:50%;background:color-mix(in srgb,var(--ink) 22%,transparent);transition:background .2s,box-shadow .2s}
.pip.on{background:var(--lily);box-shadow:0 0 10px var(--lily)}
#hud.shield .pip{background:var(--glow);box-shadow:0 0 12px var(--glow)}
#wrap.night #score{color:#F4F7FB}
#wrap.night .pip:not(.on){background:rgba(244,247,251,.25)}
#banner{position:absolute;top:30%;left:0;right:0;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s}
#banner.show{opacity:1;transform:none}
#banner .pill{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;padding:12px 24px;text-align:center}
#banner b{display:block;font-size:clamp(26px,7vmin,40px);font-weight:800;line-height:1.05;color:var(--glow)}
#banner small{display:block;font-size:16px;font-weight:600;color:var(--ink)}
.stagep{font-size:16px;color:var(--ink-soft);font-weight:600;margin-top:4px}
.newbest{color:var(--glow);font-weight:700;font-size:16px;min-height:20px}
button{font:inherit;font-weight:800;font-size:22px;border:0;border-radius:999px;padding:14px 40px;background:var(--glow);color:#1D2B3A;cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--glow) 55%,#000)}
button:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--glow) 55%,#000)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.hint{font-size:15px;color:var(--ink-soft)}
#mute{position:absolute;top:22px;right:16px;width:46px;height:46px;padding:0;border-radius:50%;font-size:20px;background:var(--panel);color:var(--ink);box-shadow:none;z-index:5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#mute:active{transform:scale(.92);box-shadow:none}
.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink-soft);font-size:18px;padding:10px 28px}
.ghost:active{transform:scale(.97);box-shadow:inset 0 0 0 2px var(--ink-soft)}
.board{list-style:none;text-align:left;margin-top:10px;min-width:230px}
.board li{display:flex;align-items:baseline;gap:10px;padding:5px 2px;font-size:17px;border-top:1px solid color-mix(in srgb,var(--ink-soft) 25%,transparent)}
.board li:first-child{border-top:0}
.board .rank{width:22px;color:var(--ink-soft);font-weight:700}
.board .who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pts{font-weight:800}
.board li.me .who,.board li.me .pts{color:var(--glow)}
.board .empty{color:var(--ink-soft);justify-content:center;border:0}
.btns{display:flex;flex-direction:column;align-items:center;gap:12px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="score" aria-live="polite" style="visibility:hidden">0</div>
  <div id="hud" style="visibility:hidden" aria-hidden="true"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
  <div id="banner" aria-live="polite"><div class="pill"><b id="bannerT"></b><small id="bannerS"></small></div></div>
  <button id="mute" aria-label="Mute sound">🔊</button>

  <div class="overlay" id="start">
    <h1>Firefly<span>Flight</span></h1>
    <p class="sub">Flutter through the reeds and clear all 4 stages. Catch 4 dewdrops to earn a shield.</p>
    <div class="btns">
      <button id="playBtn">Play</button>
      <button class="ghost hidden-lb" id="lbBtn" hidden>Leaderboard</button>
    </div>
    <p class="hint" id="bestStart"></p>
  </div>

  <div class="overlay hidden" id="lb">
    <div class="card">
      <h2>Top fireflies</h2>
      <ol class="board" id="boardFull"></ol>
    </div>
    <button class="ghost" id="lbClose">Back</button>
  </div>

  <div class="overlay hidden" id="over">
    <div class="card">
      <h2>Lights out</h2>
      <div class="stats">
        <div><b id="finalScore">0</b><small>Score</small></div>
        <div><b id="finalBest">0</b><small>Best</small></div>
      </div>
      <p class="stagep" id="finalStage"></p>
      <p class="newbest" id="newBest"></p>
      <ol class="board" id="boardOver" hidden></ol>
    </div>
    <button id="againBtn">Play again</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const wrap = document.getElementById('wrap');
  const scoreEl = document.getElementById('score');
  const startEl = document.getElementById('start'), overEl = document.getElementById('over');
  let W = 0, H = 0, dpr = 1, scale = 1;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let C = {};
  function loadColors(){ C = {top:css('--sky-top'),bot:css('--sky-bot'),water:css('--water'),reed:css('--reed'),reedD:css('--reed-dark'),glow:css('--glow'),lily:css('--lily')}; }
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pw = wrap.clientWidth, ph = wrap.clientHeight;
    // game world is measured in "game units": at least 640 tall and 360 wide,
    // scaled to fit, so the game plays the same on phones, tablets and desktops
    scale = Math.min(ph / 640, pw / 360);
    W = pw / scale; H = ph / scale;
    cv.width = pw * dpr; cv.height = ph * dpr;
    ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
    loadColors();
  }
  window.addEventListener('resize', resize);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', loadColors);
  resize();

  // ---------- sound (synthesized, no files) ----------
  let actx = null, muted = false;
  try { muted = localStorage.getItem('ff-muted') === '1'; } catch(e) {}
  const muteBtn = document.getElementById('mute');
  const paintMute = () => { muteBtn.textContent = muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Mute sound'); };
  paintMute();
  muteBtn.addEventListener('click', () => { muted = !muted; paintMute(); try { localStorage.setItem('ff-muted', muted ? '1' : '0'); } catch(e) {} if (!muted) { unlock(); sfx.tick(); } });
  function unlock(){
    if (!actx) { const A = window.AudioContext || window.webkitAudioContext; if (A) actx = new A(); }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, dur, {type='sine', vol=0.18, slide=0, delay=0}={}){
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    flap(){ tone(520 + Math.random()*60, 0.09, {type:'triangle', vol:0.08, slide:340}); },
    tick(){ tone(880, 0.07, {vol:0.1}); tone(1320, 0.09, {vol:0.07, delay:0.04}); },
    dew(){ [988, 1319, 1760].forEach((f,i) => tone(f, 0.16, {type:'sine', vol:0.12, delay:i*0.06})); },
    die(){ tone(440, 0.45, {type:'sawtooth', vol:0.09, slide:-330}); tone(220, 0.5, {type:'triangle', vol:0.12, slide:-150, delay:0.05}); },
    stage(){ [523, 659, 784, 1047].forEach((f,i) => tone(f, 0.2, {type:'triangle', vol:0.1, delay:i*0.07})); },
    shield(){ tone(523, 0.35, {type:'sine', vol:0.13, slide:523}); tone(784, 0.4, {type:'triangle', vol:0.07, slide:784, delay:0.08}); },
    crack(){ tone(320, 0.25, {type:'square', vol:0.05, slide:-220}); },
    gust(){ tone(160, 0.7, {type:'sawtooth', vol:0.025, slide:90}); },
    best(){ [784, 988, 1175, 1568].forEach((f,i) => tone(f, 0.22, {type:'triangle', vol:0.11, delay:0.5 + i*0.09})); }
  };

  let best = 0;
  try { best = +localStorage.getItem('ff-best') || 0; } catch(e) {}
  const showBest = () => document.getElementById('bestStart').textContent = best ? `Best: ${best}` : '';
  showBest();

  // ---------- stages: the goal is to clear them all ----------
  const STAGES = [
    {at:0,  name:'Still Pond',    tip:'Fly through the gaps'},
    {at:10, name:'Swaying Reeds', tip:'The reeds start to move'},
    {at:20, name:'Night Breeze',  tip:'Watch the wind lines'},
    {at:30, name:'Darkness',      tip:'Your glow lights the way'},
  ];
  const DEW_FOR_SHIELD = 4;
  const hudEl = document.getElementById('hud');
  const pips = [...hudEl.querySelectorAll('.pip')];
  const bannerEl = document.getElementById('banner');
  let bannerTimer = 0;
  function banner(title, sub, ms){
    document.getElementById('bannerT').textContent = title;
    document.getElementById('bannerS').textContent = sub;
    bannerEl.classList.add('show');
    clearTimeout(bannerTimer);
    if (ms) bannerTimer = setTimeout(() => bannerEl.classList.remove('show'), ms);
  }
  const hideBanner = () => { clearTimeout(bannerTimer); bannerEl.classList.remove('show'); };

  // game state
  const flyX = () => Math.min(W * 0.3, 300);
  let state = 'menu', fly, reeds, drops, sparks, stars, score, speed, spawnT, t = 0, shake = 0;
  let passed, stage, dew, shield, invuln, wind, streaks, tint = 0, dark = 0;
  stars = Array.from({length:40}, () => ({x:Math.random(), y:Math.random()*0.6, r:Math.random()*1.4+.4, p:Math.random()*6}));

  function renderHud(){
    pips.forEach((p, i) => p.classList.toggle('on', i < dew));
    hudEl.classList.toggle('shield', shield);
  }

  function reset(){
    fly = {x:flyX(), y:H*0.42, vy:0, r:8};
    reeds = []; drops = []; sparks = []; streaks = [];
    score = 0; speed = 2.6; spawnT = 0;
    passed = 0; stage = 0; dew = 0; shield = false; invuln = 0;
    wind = {phase:'calm', t:200, dir:1};
    scoreEl.textContent = '0';
    renderHud();
  }
  reset();
  // keep the firefly in a sensible spot if the window is resized while not playing
  window.addEventListener('resize', () => { if (state !== 'play') fly.x = flyX(); });

  const waterY = () => H - 70;
  const gapSize = () => Math.max(180, 240 - passed * 1.5);

  function spawn(x = W + 40){
    const gap = gapSize();
    // from stage 2 on, reeds bob up and down
    const amp = stage >= 1 ? 20 + Math.random() * 16 : 0;
    const margin = 70 + amp;
    const base = margin + Math.random() * Math.max(0, waterY() - margin*2 - gap);
    reeds.push({x, w:46, top:base, base, amp, ph:Math.random()*Math.PI*2, gap, passed:false});
    if (Math.random() < 0.55) drops.push({x:x + 23 + 130, y: base + gap/2 + (Math.random()-.5)*gap*0.4, got:false, p:0});
  }

  function flap(){
    if (state !== 'play') return;
    fly.vy = -6.6; sfx.flap();
    for (let i=0;i<6;i++) sparks.push({x:fly.x, y:fly.y+6, vx:-Math.random()*2-1, vy:Math.random()*2, life:1});
  }

  // Play button -> "ready": the firefly hovers until the first tap, so nobody dies before they understand the controls
  function start(){
    unlock();
    reset(); state = 'ready';
    scoreEl.style.visibility = 'visible'; hudEl.style.visibility = 'visible';
    // on wide screens, place the first reeds ahead of the firefly so there is no long empty wait
    let x = Math.min(fly.x + 480, W + 40);
    while (x <= W + 40){ spawn(x); x += 260; }
    spawnT = x - (W + 40);
    startEl.classList.add('hidden'); overEl.classList.add('hidden'); lbEl.classList.add('hidden');
    banner('Tap to fly', 'Click, tap or press Space');
  }
  function go(){
    state = 'play';
    banner('Stage 1', STAGES[0].name + ' · ' + STAGES[0].tip, 1600);
    flap();
  }

  function burst(x, y, n, pink){
    for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = 2 + Math.random()*2; sparks.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, pink}); }
  }

  // a hit either breaks the shield or ends the run
  function hurt(){
    if (invuln > 0) return true;
    if (shield){
      shield = false; invuln = 70; shake = 7; sfx.crack(); burst(fly.x, fly.y, 20, false); renderHud();
      banner('Shield broken', 'Collect dewdrops to recharge', 1200);
      return true;
    }
    die(); return false;
  }

  function die(){
    if (state !== 'play') return;
    state = 'dead'; shake = 12; sfx.die(); hideBanner();
    if (navigator.vibrate) navigator.vibrate(60);
    const isBest = score > best;
    if (isBest){ best = score; try { localStorage.setItem('ff-best', best); } catch(e) {} }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = best;
    document.getElementById('finalStage').textContent = `Reached stage ${stage + 1} of ${STAGES.length}: ${STAGES[stage].name}`;
    document.getElementById('newBest').textContent = isBest && score > 0 ? 'New best!' : '';
    if (isBest && score > 0) sfx.best();
    submitScore(best);
    renderBoards();
    setTimeout(() => overEl.classList.remove('hidden'), 550);
    showBest();
  }

  function updateWind(dt){
    if (stage < 2){ wind.phase = 'calm'; return; }
    wind.t -= dt;
    if (wind.t <= 0){
      if (wind.phase === 'calm'){ wind.phase = 'warn'; wind.t = 75; wind.dir = Math.random() < 0.5 ? -1 : 1; }
      else if (wind.phase === 'warn'){ wind.phase = 'gust'; wind.t = 85; sfx.gust(); }
      else { wind.phase = 'calm'; wind.t = 180 + Math.random()*140; }
    }
    if (wind.phase === 'gust') fly.vy += 0.11 * wind.dir * dt;
    // wind lines show the direction a moment before the gust hits
    if (wind.phase !== 'calm' && Math.random() < (wind.phase === 'gust' ? 0.9 : 0.4) * dt)
      streaks.push({x:Math.random()*(W+200), y:wind.dir > 0 ? -30 : H, len:30 + Math.random()*40, life:1});
  }

  // dt = 1.0 at 60fps, 0.5 at 120fps, 0.42 at 144fps -> same speed on every screen
  function update(dt){
    t += dt;
    stars.forEach(s => s.p += 0.03 * dt);
    const ease = 1 - Math.pow(0.97, dt);
    tint += ([0, 0.12, 0.3, 0.45][stage] - tint) * ease;
    dark += ((state !== 'menu' && stage >= 3 ? 1 : 0) - dark) * ease;
    wrap.classList.toggle('night', dark > 0.4);
    if (state === 'menu' || state === 'ready'){ fly.y = H*0.42 + Math.sin(t/22)*12; return; }
    fly.vy += 0.33 * dt; fly.vy = Math.max(-9, Math.min(fly.vy, 8));
    fly.y += fly.vy * dt;
    if (state === 'dead'){ if (fly.y > waterY()) fly.y = waterY(); return; }

    if (invuln > 0) invuln -= dt;
    updateWind(dt);
    streaks.forEach(s => { s.x -= (speed * 2.2) * dt; s.y += wind.dir * 7 * dt; s.life -= 0.012 * dt; });
    streaks = streaks.filter(s => s.life > 0 && s.y > -80 && s.y < H + 80);

    speed = 2.5 + Math.min(passed * 0.035, 1.4);
    spawnT -= speed * dt;
    if (spawnT <= 0){ spawn(); spawnT = 260; }

    reeds.forEach(r => {
      r.x -= speed * dt;
      if (r.amp){ r.ph += 0.022 * dt; r.top = r.base + Math.sin(r.ph) * r.amp; }
      if (!r.passed && r.x + r.w < fly.x){
        r.passed = true; passed++; score++; scoreEl.textContent = score; sfx.tick();
        const next = stage + 1;
        if (next < STAGES.length && passed >= STAGES[next].at){
          stage = next; sfx.stage();
          banner(`Stage ${stage + 1}`, STAGES[stage].name + ' · ' + STAGES[stage].tip, 2000);
        }
      }
      const inX = fly.x + fly.r > r.x && fly.x - fly.r < r.x + r.w;
      if (state === 'play' && inX && (fly.y - fly.r < r.top || fly.y + fly.r > r.top + r.gap)) hurt();
    });
    reeds = reeds.filter(r => r.x > -80);

    drops.forEach(d => {
      d.x -= speed * dt; d.p += 0.08 * dt;
      if (!d.got && Math.hypot(d.x - fly.x, d.y - fly.y) < 22){
        d.got = true; score += 3; scoreEl.textContent = score; sfx.dew(); burst(d.x, d.y, 14, true);
        if (!shield){
          dew++;
          if (dew >= DEW_FOR_SHIELD){ dew = 0; shield = true; sfx.shield(); banner('Shield ready', 'It saves you from one hit', 1400); }
          renderHud();
        }
      }
    });
    drops = drops.filter(d => d.x > -30 && !d.got);

    // water and sky: with a shield (or right after losing one) you bounce instead of dying
    if (fly.y - fly.r < 0){ fly.y = fly.r; fly.vy = Math.max(fly.vy, 1); }
    if (fly.y + fly.r > waterY() && state === 'play' && hurt()){ fly.y = waterY() - fly.r; fly.vy = -6.6; }

    sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= 0.035 * dt; });
    sparks = sparks.filter(s => s.life > 0);
  }

  function drawReed(r){
    const wy = waterY();
    ctx.fillStyle = C.reed;
    // top reed hangs from sky as a willow branch
    roundRect(r.x, -20, r.w, r.top + 20, 22);
    // bottom reed rises from water
    roundRect(r.x, r.top + r.gap, r.w, wy - (r.top + r.gap) + 20, 22);
    ctx.fillStyle = C.reedD;
    roundRect(r.x + r.w*0.62, -20, r.w*0.2, r.top + 14, 8);
    roundRect(r.x + r.w*0.62, r.top + r.gap + 6, r.w*0.2, wy - (r.top + r.gap), 8);
    // cattail tip
    ctx.fillStyle = C.reedD;
    ctx.beginPath(); ctx.ellipse(r.x + r.w/2, r.top + r.gap + 4, r.w*0.42, 14, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r.x + r.w/2, r.top - 4, r.w*0.42, 14, 0, 0, Math.PI*2); ctx.fill();
  }
  function roundRect(x,y,w,h,rad){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,rad) : ctx.rect(x,y,w,h); ctx.fill(); }

  function draw(dt){
    ctx.save();
    if (shake > 0){ ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= Math.pow(0.85, dt); if (shake < .5) shake = 0; }
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, C.top); g.addColorStop(1, C.bot);
    ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);
    // the sky slowly turns to night as you clear stages
    if (tint > 0.005){ ctx.fillStyle = `rgba(12,18,44,${tint})`; ctx.fillRect(-20,-20,W+40,H+40); }

    stars.forEach(s => { ctx.globalAlpha = Math.max(0, (0.35 + Math.sin(s.p)*0.3) * (0.6 + tint)); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;

    reeds.forEach(drawReed);

    // water
    const wy = waterY();
    ctx.fillStyle = C.water; ctx.fillRect(-20, wy, W+40, H - wy + 20);
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
    for (let i=0;i<3;i++){ ctx.beginPath(); for (let x=0;x<=W;x+=8){ const y = wy + 14 + i*16 + Math.sin(x/28 + t/18 + i)*3; x ? ctx.lineTo(x,y) : ctx.moveTo(x,y);} ctx.stroke(); }

    // wind lines
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    streaks.forEach(s => {
      ctx.globalAlpha = s.life * (wind.phase === 'gust' ? 0.55 : 0.3);
      const dx = -speed * 2.2, dy = wind.dir * 7, k = s.len / Math.hypot(dx, dy);
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - dx*k, s.y - dy*k); ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // sparks
    sparks.forEach(s => { ctx.globalAlpha = s.life; ctx.fillStyle = s.pink ? C.lily : C.glow; ctx.beginPath(); ctx.arc(s.x, s.y, 2.6*s.life+1, 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;

    // darkness: only the area around (and just ahead of) the firefly stays lit
    if (dark > 0.01){
      const lx = fly.x + 90, ly = fly.y;
      const dg = ctx.createRadialGradient(lx, ly, 110, lx, ly, 360);
      dg.addColorStop(0, 'rgba(6,9,22,0)'); dg.addColorStop(1, `rgba(6,9,22,${0.78 * dark})`);
      ctx.fillStyle = dg; ctx.fillRect(-20,-20,W+40,H+40);
    }

    // dewdrops glow, so they stay visible in the dark
    drops.forEach(d => {
      const y = d.y + Math.sin(d.p)*4;
      ctx.shadowColor = C.lily; ctx.shadowBlur = 16; ctx.fillStyle = C.lily;
      ctx.beginPath(); ctx.moveTo(d.x, y - 11); ctx.quadraticCurveTo(d.x + 9, y + 2, d.x, y + 8); ctx.quadraticCurveTo(d.x - 9, y + 2, d.x, y - 11); ctx.fill();
      ctx.shadowBlur = 0;
    });

    // firefly
    const tilt = Math.max(-0.5, Math.min(0.9, fly.vy/10));
    ctx.save(); ctx.translate(fly.x, fly.y);
    if (shield){
      ctx.strokeStyle = C.glow; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.6 + Math.sin(t/8)*0.25;
      ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(t/8)*1.5, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (invuln > 0 && Math.floor(t/4) % 2) ctx.globalAlpha = 0.35;
    ctx.rotate(tilt);
    const halo = ctx.createRadialGradient(0,0,2,0,0,40);
    halo.addColorStop(0, C.glow); halo.addColorStop(1, 'transparent');
    const a0 = ctx.globalAlpha;
    ctx.globalAlpha = a0 * (0.55 + Math.sin(t/6)*0.15); ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = a0;
    const flapA = Math.sin(t/2.2)*0.6;
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.ellipse(-2,-9,9,5,-0.6+flapA,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4,-9,8,4.5,-0.2+flapA,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = C.glow; ctx.beginPath(); ctx.ellipse(-4,2,10,8,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2B2F3A'; ctx.beginPath(); ctx.ellipse(7,-1,7,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(9,-2.5,2.2,0,Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  let last = performance.now();
  function loop(now){
    // cap dt so a tab switch or lag spike can't teleport the firefly into a reed
    const dt = Math.min((now - last) / (1000 / 60), 3);
    last = now;
    update(dt); draw(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(t0 => { last = t0; loop(t0); });

  const press = e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    if (state === 'play') flap(); else if (state === 'ready') go();
  };
  wrap.addEventListener('pointerdown', press);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'play') flap();
      else if (state === 'ready') go();
      else if (state === 'menu' || !overEl.classList.contains('hidden')) start();
    }
  });
  // ---------- leaderboard (shared) ----------
  const lbEl = document.getElementById('lb');
  let db = null, user = null, myId = null, top = [], posted = 0;
  async function initBoard(){
    try {
      [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    } catch(e) { return; }
    if (!db) return;
    if (user) { try { myId = await user.id(); } catch(e) {} }
    document.getElementById('lbBtn').hidden = false;
    if (myId) {
      try { const s = await db.doc('scores/' + myId).get(); if (s.exists) posted = +(s.data().score) || 0; } catch(e) {}
      if (best > posted) submitScore(best);
    }
    db.collection('scores').orderBy('score', 'desc').limit(10).onSnapshot(snap => {
      top = snap.docs.map(d => ({id:d.id, score:+(d.data()?.score) || 0}));
      renderBoards();
    }, () => {});
  }
  async function submitScore(s){
    if (!db || !myId || s <= posted) return;
    const prev = posted; posted = s;
    try { await db.doc('scores/' + myId).set({score: s, at: Date.now()}); } catch(e) { posted = prev; }
  }
  async function renderBoards(){
    let names = {};
    if (user && top.length) { try { names = await user.profiles(top.map(t => t.id)); } catch(e) {} }
    for (const id of ['boardFull', 'boardOver']) {
      const ol = document.getElementById(id);
      const rows = id === 'boardOver' ? top.slice(0, 5) : top;
      ol.replaceChildren();
      if (id === 'boardOver') ol.hidden = !db || !rows.length;
      if (!rows.length) {
        const li = document.createElement('li'); li.className = 'empty';
        li.textContent = db ? 'No scores yet. Be the first.' : 'Leaderboard is unavailable here.';
        ol.append(li); continue;
      }
      rows.forEach((r, i) => {
        const li = document.createElement('li'); if (r.id === myId) li.className = 'me';
        const a = document.createElement('span'); a.className = 'rank'; a.textContent = i + 1;
        const b = document.createElement('span'); b.className = 'who';
        b.textContent = r.id === myId ? 'You' : ((names[r.id] && names[r.id].name) || 'A firefly');
        const c = document.createElement('span'); c.className = 'pts'; c.textContent = r.score;
        li.append(a, b, c); ol.append(li);
      });
    }
  }
  document.getElementById('lbBtn').addEventListener('click', () => { unlock(); renderBoards(); startEl.classList.add('hidden'); lbEl.classList.remove('hidden'); });
  document.getElementById('lbClose').addEventListener('click', () => { lbEl.classList.add('hidden'); startEl.classList.remove('hidden'); });
  if (window.claude && claude.use) initBoard();

  document.getElementById('playBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
})();
</script>
</body>
</html>
